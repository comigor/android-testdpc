// Task to copy wear DEBUG APK to phone app assets for OTA installation
task copyWearDebugApkToAssets(type: Copy) {
    from("wear/build/outputs/apk/debug/wear-debug.apk")
    into("src/main/assets")
    rename { "wear-debug.apk" }
}

// Task to copy wear RELEASE APK to phone app assets for OTA installation
// Handles both signed (wear-release.apk) and unsigned (wear-release-unsigned.apk)
task copyWearReleaseApkToAssets {
    dependsOn(":wear:assembleRelease")

    doLast {
        def releaseDir = file("wear/build/outputs/apk/release")
        def signedApk = new File(releaseDir, "wear-release.apk")
        def unsignedApk = new File(releaseDir, "wear-release-unsigned.apk")
        def destDir = file("src/main/assets")
        def destFile = new File(destDir, "wear-release.apk")

        destDir.mkdirs()

        if (signedApk.exists()) {
            println "Copying signed wear APK: ${signedApk.name}"
            destFile.bytes = signedApk.bytes
        } else if (unsignedApk.exists()) {
            println "Copying unsigned wear APK: ${unsignedApk.name}"
            destFile.bytes = unsignedApk.bytes
        } else {
            throw new GradleException("No wear release APK found in ${releaseDir}")
        }

        println "Wear APK copied to: ${destFile} (${destFile.length() / 1024} KB)"
    }
}

// Make sure wear APK is built before copying
tasks.named("copyWearDebugApkToAssets").configure {
    dependsOn(":wear:assembleDebug")
}

// Copy wear APK before processing resources
tasks.matching { it.name == "mergeDebugAssets" }.configureEach {
    dependsOn(copyWearDebugApkToAssets)
}

tasks.matching { it.name == "mergeReleaseAssets" }.configureEach {
    dependsOn(copyWearReleaseApkToAssets)
}
