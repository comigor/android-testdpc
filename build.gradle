// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id("com.android.application") version('8.13.2')
    id("com.android.library") version('8.13.2') apply(false)
}

subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.library")) {
            project.android {
                defaultConfig {
                    minSdkVersion 26
                }
                compileSdkVersion 36
                buildToolsVersion "36.0.0"

                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_11
                    targetCompatibility JavaVersion.VERSION_11
                }

                buildFeatures {
                    aidl true
                }
            }

            project.dependencies {
                implementation("androidx.annotation:annotation:1.5.0")
                implementation("androidx.appcompat:appcompat:1.6.1")
                implementation("androidx.appcompat:appcompat-resources:1.6.1")
                implementation("androidx.collection:collection:1.2.0")
                implementation("androidx.constraintlayout:constraintlayout:2.1.3")
                implementation("androidx.core:core:1.9.0")
                implementation("androidx.enterprise:enterprise-feedback:1.1.0")
                implementation("androidx.legacy:legacy-support-core-ui:1.0.0")
                implementation("androidx.legacy:legacy-support-v13:1.0.0")
                implementation("androidx.lifecycle:lifecycle-common:2.5.1")
                implementation("androidx.lifecycle:lifecycle-process:2.5.1")
                implementation("androidx.lifecycle:lifecycle-runtime:2.5.1")
                implementation("androidx.localbroadcastmanager:localbroadcastmanager:1.1.0")
                implementation("androidx.preference:preference:1.1.0")
                implementation("androidx.recyclerview:recyclerview:1.2.0")
                implementation("androidx.window:window:1.2.0")
                implementation("com.google.android.material:material:1.6.1")
                implementation("com.google.guava:guava:31.1-android")
                implementation("javax.inject:javax.inject:1")
                implementation("org.robolectric:robolectric-annotations:3.3.2")
                implementation("org.robolectric:shadows-core:3.3.2")
                implementation("org.bouncycastle:bcpkix-jdk15on:1.70")
                implementation("org.bouncycastle:bcprov-jdk15on:1.70")
                implementation("com.google.truth:truth:1.4.2")

                implementation("androidx.security:security-crypto:1.0.0")
                implementation("androidx.biometric:biometric:1.2.0-alpha05")
                implementation("com.github.tonyofrancis.Fetch:fetch2:3.4.1")
            }
        }
    }
}

buildDir = "build2"

ext {
    /* Version code for *next* release, bump *after* a release is created. */
    // 1 or more digits
    versionMajor = 9
    // exactly 1 digiT
    versionMinor = 1
    // exactly 2 digits
    versionBuild = 21
}

android {
    namespace 'com.afwsamples.testdpc'
    compileSdk 36
    compileSdkVersion 36

    defaultConfig {
        applicationId "dev.borges.shadow"
        minSdk 26
        targetSdk 36
        versionCode versionMajor * 1000 + versionMinor * 100 + versionBuild
        versionName "${versionMajor}.${versionMinor}.${versionBuild}"
        multiDexEnabled true
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("SHADOW_KEYSTORE_PATH")
            if (keystorePath != null && file(keystorePath).exists()) {
                storeFile file(keystorePath)
                storePassword System.getenv("SHADOW_KEYSTORE_PASSWORD")
                keyAlias System.getenv("SHADOW_KEY_ALIAS")
                keyPassword System.getenv("SHADOW_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            def keystorePath = System.getenv("SHADOW_KEYSTORE_PATH")
            if (keystorePath != null && file(keystorePath).exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        aidl true
    }

    sourceSets.main {
        manifest.srcFile 'src/main/AndroidManifest.xml'
        java.srcDirs = ['src/main/java', 'partnerconfig/java']
        aidl.srcDirs = ['src/main/aidl']
        res.srcDirs = ['src/main/res']
    }
}

dependencies {
    implementation("androidx.annotation:annotation:1.5.0")
    implementation("androidx.appcompat:appcompat:1.6.1")
